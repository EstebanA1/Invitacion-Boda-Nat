<section id="scene-envelope-prerender" class="invitation-scene bg-envelope-paper direct-initial-scene" data-scene="envelope" aria-hidden="true">
  <div class="layered-scene open-envelope-composition">
    <div class="open-envelope-stage">
      <picture class="static-envelope-layer">
        <source media="(max-width: 480px)" data-mobile-srcset="/invitation/scene/envelope-back-mobile.webp" />
        <img class="open-envelope-back" data-envelope-src="/invitation/scene/envelope-back.webp" alt="" width="808" height="1000" loading="eager" decoding="async" />
      </picture>
      <div class="open-envelope-photo-frame">
        <picture class="static-envelope-photo">
          <source media="(max-width: 480px)" data-mobile-srcset="/invitation/scene/envelope-looking-september-mobile.webp" />
          <img data-envelope-src="/invitation/scene/envelope-looking-september.webp" alt="" width="800" height="1248" loading="eager" decoding="async" />
        </picture>
      </div>
      <picture class="static-envelope-layer">
        <source media="(max-width: 480px)" data-mobile-srcset="/invitation/scene/envelope-front-mobile.webp" />
        <img class="open-envelope-front" data-envelope-src="/invitation/scene/envelope-front.webp" alt="" width="960" height="800" loading="eager" decoding="sync" fetchpriority="high" />
      </picture>
      <picture class="static-envelope-layer">
        <source media="(max-width: 480px)" data-mobile-srcset="/invitation/scene/envelope-pearls-mobile.webp" />
        <img class="open-envelope-pearls" data-envelope-src="/invitation/scene/envelope-pearls.webp" alt="" width="420" height="738" loading="eager" decoding="async" />
      </picture>
    </div>
  </div>
</section>
