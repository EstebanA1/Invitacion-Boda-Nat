<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3f2f2" />
    <meta name="description" content="Invitación digital al matrimonio de Natalia Aguayo y Gabriel Figueroa, el sábado 28 de noviembre de 2026." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:title" content="Natalia &amp; Gabriel - Invitación de Boda" />
    <meta property="og:description" content="Acompáñanos a celebrar nuestro matrimonio el 28 de noviembre de 2026." />
    <title>Natalia & Gabriel - Invitación de Boda</title>
    <link rel="icon" href="/invitation/favicon.png" type="image/png" />
    <!-- cover-critical -->
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const target = location.hash.slice(1);
        const isCoverRoute = !params.get("admin")
          && params.get("guide") !== "1"
          && (!target || target === "scene-cover" || target === "inicio");

        document.documentElement.dataset.entry = isCoverRoute ? "cover" : "journey";
        document.documentElement.dataset.entryTarget = target;
        window.__WEDDING_DIRECT_ENTRY__ = !isCoverRoute;
        const preloads = [];

        if (isCoverRoute) {
          const coverEnvelope = matchMedia("(max-width: 480px)").matches
            ? "/invitation/cover-envelope-mobile.avif"
            : "/invitation/cover-envelope.webp";
          const coverEnvelopeType = coverEnvelope.endsWith(".avif") ? "image/avif" : "image/webp";
          preloads.push(
            [coverEnvelope, "image", coverEnvelopeType, true],
            ["/fonts/pinyon-script-latin.woff2", "font", "font/woff2"],
            ["/fonts/cormorant-garamond-latin.woff2", "font", "font/woff2"],
            ["/fonts/cinzel-latin.woff2", "font", "font/woff2"],
          );
        } else if (target === "scene-envelope") {
          const envelopeFront = matchMedia("(max-width: 480px)").matches
            ? "/invitation/scene/envelope-front-mobile.webp"
            : "/invitation/scene/envelope-front.webp";
          preloads.push([envelopeFront, "image", "image/webp", true]);
        } else if (target === "scene-program") {
          preloads.push(
            ["/invitation/scene/program-frame.avif", "image", "image/avif", true],
            ["/invitation/scene/program-envelope.avif", "image", "image/avif"],
            ["/fonts/pinyon-script-latin.woff2", "font", "font/woff2"],
            ["/fonts/cormorant-garamond-latin.woff2", "font", "font/woff2"],
            ["/fonts/cormorant-garamond-italic-latin.woff2", "font", "font/woff2"],
          );
        } else if (target === "scene-details") {
          preloads.push(
            ["/invitation/scene/location-frame.avif", "image", "image/avif", true],
            ["/fonts/pinyon-script-latin.woff2", "font", "font/woff2"],
            ["/fonts/cormorant-garamond-latin.woff2", "font", "font/woff2"],
            ["/fonts/cormorant-garamond-italic-latin.woff2", "font", "font/woff2"],
          );
        } else if (target === "scene-countdown") {
          preloads.push(
            ["/invitation/scene/gift-card.avif", "image", "image/avif", true],
            ["/fonts/pinyon-script-latin.woff2", "font", "font/woff2"],
            ["/fonts/cormorant-garamond-latin.woff2", "font", "font/woff2"],
            ["/fonts/cormorant-garamond-italic-latin.woff2", "font", "font/woff2"],
          );
        } else if (target === "rsvp") {
          preloads.push(
            ["/fonts/great-vibes-latin.woff2", "font", "font/woff2"],
            ["/fonts/cinzel-latin.woff2", "font", "font/woff2"],
            ["/fonts/montserrat-latin.woff2", "font", "font/woff2"],
          );
        }

        preloads.forEach(([href, as, type, highPriority]) => {
          const link = document.createElement("link");
          link.rel = "preload";
          link.href = href;
          link.as = as;
          link.type = type;
          if (as === "font") link.crossOrigin = "anonymous";
          if (highPriority) link.fetchPriority = "high";
          document.head.appendChild(link);
        });
      })();
    </script>
    <!-- journey-preloads -->
  </head>
  <body>
    <div id="root"><div id="wedding-invitation" class="wedding-invitation"><button id="quick-rsvp-button" type="button" class="quick-rsvp" data-group="navigation" aria-label="Confirmar asistencia" title="Confirmar asistencia"><span class="quick-rsvp-symbol" aria-hidden="true">&#9993;</span></button><main id="invitation-content" class="invitation-scroll"><section id="scene-cover" class="invitation-scene bg-cover-paper" data-scene="cover"><div id="cover-background" class="bg-paper-glow" data-group="background"></div><button id="cover-open-button" type="button" class="opening-card" data-group="interaction" title="Abrir invitación"><div id="cover-canvas" class="layered-scene cover-composition" aria-hidden="true"><img id="cover-flower-top" class="cover-floral cover-floral-top" data-group="decoration" data-cover-src="/invitation/cover-flower-top.webp" data-cover-mobile-src="/invitation/cover-flower-top-mobile.webp" data-cover-mobile-avif="/invitation/cover-flower-top-mobile.avif" alt="" decoding="async" /><div id="cover-intro" class="cover-intro" data-group="text"><span>Estás cordialmente invitado</span><span>a la boda de</span></div><h1 id="cover-names" class="cover-names" data-group="text"><span>Natalia</span><small>&amp;</small><span>Gabriel</span></h1><img id="cover-envelope" class="cover-envelope" data-group="envelope" data-cover-src="/invitation/cover-envelope.webp" data-cover-mobile-src="/invitation/cover-envelope-mobile.webp" data-cover-mobile-avif="/invitation/cover-envelope-mobile.avif" alt="" width="600" height="444" loading="eager" decoding="async" fetchpriority="high" /><img id="cover-seal" class="cover-seal" data-group="envelope" data-cover-src="/invitation/cover-seal.webp" data-cover-mobile-src="/invitation/cover-seal-mobile.webp" alt="" decoding="async" /><img id="cover-bouquet" class="cover-bouquet" data-group="decoration" data-cover-src="/invitation/cover-bouquet.webp" data-cover-mobile-src="/invitation/cover-bouquet-mobile.webp" alt="" decoding="async" /><div id="cover-reserved" class="cover-reserved" data-group="text"><span>Hemos reservado</span><strong id="cover-place-count">1</strong><span id="cover-place-label">lugar en tu honor</span></div><img id="cover-flower-bottom" class="cover-floral cover-floral-bottom" data-group="decoration" data-cover-src="/invitation/cover-flower-bottom.webp" data-cover-mobile-src="/invitation/cover-flower-bottom-mobile.webp" data-cover-mobile-avif="/invitation/cover-flower-bottom-mobile.avif" alt="" decoding="async" /></div></button><button id="cover-open-hint" type="button" class="open-hint" data-group="interaction">Abrir invitación<span class="open-hint-icon" aria-hidden="true"></span></button></section></main></div></div>
    <script>
      if (new URLSearchParams(location.search).get("inv") === "2") {
        document.getElementById("cover-place-count").textContent = "2";
        document.getElementById("cover-place-label").textContent = "lugares en tu honor";
      }

      if (document.documentElement.dataset.entry === "cover") {
        const useMobileImages = matchMedia("(max-width: 480px)").matches;
        document.querySelectorAll("[data-cover-src]").forEach((image) => {
          const mobileFallback = image.dataset.coverMobileSrc;
          const mobileAvif = image.dataset.coverMobileAvif
            || (image.id === "cover-bouquet" ? "/invitation/cover-bouquet-mobile.avif" : undefined);
          const source = useMobileImages
            ? mobileAvif || mobileFallback || image.dataset.coverSrc
            : image.dataset.coverSrc;

          if (useMobileImages && mobileAvif && mobileFallback) {
            image.addEventListener("error", () => {
              image.src = mobileFallback;
            }, { once: true });
          }

          if (image.id === "cover-envelope") image.decoding = "sync";
          if (source) image.src = source;
        });
      }

      if (document.documentElement.dataset.entryTarget === "scene-envelope") {
        document.querySelectorAll("#scene-envelope-prerender [data-mobile-srcset]").forEach((source) => {
          source.srcset = source.dataset.mobileSrcset;
        });
        document.querySelectorAll("#scene-envelope-prerender [data-envelope-src]").forEach((image) => {
          image.src = image.dataset.envelopeSrc;
        });
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
